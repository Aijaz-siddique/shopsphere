spring.application.name=order-service
server.port=8082

spring.datasource.url=jdbc:postgresql://localhost:5432/shopsphere?options=-c%20TimeZone=Asia/Kolkata
spring.datasource.username=shopsphere
spring.datasource.password=shopsphere_dev_password

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
spring.jpa.properties.hibernate.default_schema=orders

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=orders
spring.flyway.schemas=orders

management.endpoints.web.exposure.include=health,info

product-service.url=http://localhost:8081
inventory-service.url=http://localhost:8084